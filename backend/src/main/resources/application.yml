server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: polyglotmesh
  codec:
    max-in-memory-size: 128KB
  datasource:
    url: jdbc:h2:file:./data/polyglotmesh
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

polyglotmesh:
  execution:
    timeout-ms: 15000